name: release

# Каждый пуш в master создаёт тег vX.Y.(Z+1) от последнего релизного тега и публикует релиз.
# Ручной тег (git push origin v1.1.0) тоже собирает релиз; следующие автотеги продолжат с него.
# Тег, запушенный через GITHUB_TOKEN, не запускает workflow повторно, поэтому дублей нет.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: go test ./...
      - name: Create tag
        if: github.ref_type == 'branch'
        run: |
          if git describe --exact-match --tags --match 'v*' HEAD >/dev/null 2>&1; then
            echo "HEAD уже помечен тегом $(git describe --exact-match --tags HEAD)"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Новый тег: $next (предыдущий: ${last:-нет})"
          git tag "$next"
          git push origin "$next"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
